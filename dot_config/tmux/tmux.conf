set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# New panes, windows, and sessions all open in ~/Developer by default.
bind '"' split-window -c "~/Developer"
bind % split-window -h -c "~/Developer"
bind c new-window -c "~/Developer"
bind C new-session -c "~/Developer"

# Reload this config without restarting the server
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

run '~/.config/tmux/plugins/tpm/tpm'
